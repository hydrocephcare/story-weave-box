name: Daily topic pages and AI overviews
on:
  schedule:
    - cron: "0 2 * * *"
  # Use workflow_dispatch after a controlled Cloudflare release; scheduled runs keep publishing daily.\n  workflow_dispatch:
    inputs:
      count:
        description: "How many new comprehensive topic pages to write"
        required: false
        default: "40"
      review:
        description: "How many legacy topic pages to regenerate and Gemini-review"
        required: false
        default: "40"
      deep:
        description: "How many live topic pages to receive deep exam notes"
        required: false
        default: "40"
      check:
        description: "How many library notes to cross-check"
        required: false
        default: "40"
permissions:
  contents: write
  id-token: write
concurrency:
  group: topics-daily
  cancel-in-progress: true
jobs:
  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TOPIC_MAINTENANCE_URL: https://www.ompathstudy.com/api/neon-functions?name=topic-maintenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Verify Ompath topic maintenance API
        run: node scripts/topics/verify-maintenance.mjs
      - name: Restore yesterday's reading of the library
        uses: actions/cache@v4
        with:
          path: .cache/topics-corpus.json
          key: topics-corpus-${{ github.run_id }}
          restore-keys: topics-corpus-
      - name: Rebuild topic pages from the library
        id: rebuild
        continue-on-error: true
        run: node scripts/topics/build-topics.mjs --fresh
      - name: Rebuild the picture sitemap
        id: image_sitemap
        continue-on-error: true
        run: node scripts/seo/image-sitemap.mjs
      - name: Write new comprehensive topic pages (Groq)
        id: topic_pages
        continue-on-error: true
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: node scripts/topics/bulk-fill.mjs ${{ inputs.count || (github.event_name == 'push' && '4') || '40' }} --parallel=3
      - name: Rebuild static topic pages with the new comprehensive AI content
        id: merge_new_topics
        continue-on-error: true
        run: node scripts/topics/build-topics.mjs --fresh
      - name: Rebuild picture sitemap after new topic generation
        id: image_sitemap_after_topics
        continue-on-error: true
        run: node scripts/seo/image-sitemap.mjs
      - name: Save new topic pages immediately
        if: always()
        run: node scripts/git/commit-generated.mjs "Daily comprehensive topic pages" public/topics src/data/topicAi public/image-sitemap.xml
      - name: Regenerate and Gemini-review legacy published topics
        id: legacy_review
        continue-on-error: true
        timeout-minutes: 30
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TOPIC_REVIEW_COUNT: ${{ inputs.review || (github.event_name == 'push' && '4') || '40' }}
        run: node scripts/topics/review-database-pages.mjs
      - name: Generate comprehensive deep exam notes for live topic pages
        id: live_deep
        continue-on-error: true
        timeout-minutes: 60
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TOPIC_DEEP_DB_COUNT: ${{ inputs.deep || (github.event_name == 'push' && '4') || '40' }}
          TOPIC_DEEP_DB_PARALLEL: "2"
        run: node scripts/topics/deep-fill-database.mjs
      - name: Fill the static topic corpus deep-note queue
        id: static_deep
        continue-on-error: true
        timeout-minutes: 45
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: node scripts/topics/deep-fill.mjs ${{ inputs.deep || (github.event_name == 'push' && '4') || '40' }}
      - name: Merge generated deep exam notes into the static topic pages
        id: merge_deep
        continue-on-error: true
        run: node scripts/topics/build-topics.mjs --fresh
      - name: Rebuild final picture sitemap
        id: final_image_sitemap
        continue-on-error: true
        run: node scripts/seo/image-sitemap.mjs
      - name: Cross-check library notes
        id: note_check
        continue-on-error: true
        timeout-minutes: 30
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: node scripts/imed/validate-notes.mjs ${{ inputs.check || (github.event_name == 'push' && '4') || '40' }}
      - name: Write page summaries
        id: summaries
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: node scripts/summaries/fill.mjs 25 --parallel=2
      - name: Save generated topic and review data
        if: always()
        run: node scripts/git/commit-generated.mjs "Daily AI topic and note updates" public/topics src/data/topicAi src/data/pageSummaries.json src/data/contentChecks.json src/data/contentMarks.json public/image-sitemap.xml
      - name: Report incomplete automation stages
        if: always()
        env:
          REBUILD: ${{ steps.rebuild.outcome }}
          TOPICS: ${{ steps.topic_pages.outcome }}
          LEGACY_REVIEW: ${{ steps.legacy_review.outcome }}
          LIVE_DEEP: ${{ steps.live_deep.outcome }}
          STATIC_DEEP: ${{ steps.static_deep.outcome }}
          NOTE_CHECK: ${{ steps.note_check.outcome }}
          MERGE_NEW: ${{ steps.merge_new_topics.outcome }}
          MERGE_DEEP: ${{ steps.merge_deep.outcome }}
          IMAGE_INITIAL: ${{ steps.image_sitemap.outcome }}
          IMAGE_NEW: ${{ steps.image_sitemap_after_topics.outcome }}
          IMAGE_FINAL: ${{ steps.final_image_sitemap.outcome }}
          SUMMARIES: ${{ steps.summaries.outcome }}
        run: |
          failed=0
          for value in "$REBUILD" "$TOPICS" "$LEGACY_REVIEW" "$LIVE_DEEP" "$STATIC_DEEP" "$NOTE_CHECK" "$MERGE_NEW" "$MERGE_DEEP" "$IMAGE_INITIAL" "$IMAGE_NEW" "$IMAGE_FINAL" "$SUMMARIES"; do
            echo "$value"
            if [ "$value" != "success" ]; then failed=1; fi
          done
          exit "$failed"

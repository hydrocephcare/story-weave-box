name: Daily topic pages and AI overviews

# Every day at 05:00 Nairobi time (02:00 UTC):
#   1. the topic pages are rebuilt from the notes, MCQs and essays (so new notes show up on their topic pages),
#   2. every morning 25 more topics get a full page (Groq first, Gemini as the backup; needs the GROQ_API_KEYS and GEMINI_API_KEYS secrets),
#   2b. up to 12 topics get their deep exam notes (the Pro layer, written ahead of time so nobody waits or spends credits),
#   3. the new overviews are committed, which redeploys the site and refreshes the sitemap.
# Run it yourself any time: GitHub > Actions > "Daily topic pages and AI overviews" > Run workflow.
# AI overviews are saved as "not reviewed" and say so on the page. To mark one as checked by a doctor, set "reviewed": true in src/data/topicAi/<topic>.json.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many topic pages to write this run"
        required: false
        default: "25"
      deep:
        description: "How many topics get deep exam notes this run"
        required: false
        default: "12"
      check:
        description: "How many notes the second AI cross-checks this run"
        required: false
        default: "8"

permissions:
  contents: write

concurrency:
  group: topics-daily
  cancel-in-progress: false

jobs:
  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore yesterday's reading of the library (so only what changed is read from the database)
        uses: actions/cache@v4
        with:
          path: .cache/topics-corpus.json
          key: topics-corpus-${{ github.run_id }}
          restore-keys: topics-corpus-

      - name: Rebuild the topic pages
        run: node scripts/topics/build-topics.mjs --fresh

      - name: Rebuild the picture sitemap (every picture on the site, under its page)
        continue-on-error: true
        run: node scripts/seo/image-sitemap.mjs

      - name: Write today's topic pages
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: node scripts/topics/bulk-fill.mjs ${{ inputs.count || '25' }} --parallel=3

      # Saved straight away: the slower steps below once ran past the time limit and the day's finished pages were thrown away
      - name: Save the new topic pages now
        run: |
          if [ -n "$(git status --porcelain public/topics src/data/topicAi public/image-sitemap.xml)" ]; then
            git config user.name "ompath-bot"
            git config user.email "ompath-bot@users.noreply.github.com"
            git add -f public/topics src/data/topicAi public/image-sitemap.xml
            git commit -m "Daily AI topic overviews"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Write today's deep exam notes (stops by itself when the AI keys run out)
        continue-on-error: true
        timeout-minutes: 25
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: node scripts/topics/deep-fill.mjs ${{ inputs.deep || '12' }}

      - name: Cross-check notes with a second AI (marks the clean ones, lists the rest in Admin > Content checks)
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: node scripts/imed/validate-notes.mjs ${{ inputs.check || '8' }}

      - name: Write today's page summaries
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: node scripts/summaries/fill.mjs 25 --parallel=2

      - name: Save the new overviews
        if: always()
        run: |
          if [ -z "$(git status --porcelain public/topics src/data/topicAi src/data/pageSummaries.json src/data/contentChecks.json src/data/contentMarks.json)" ]; then
            echo "No new overviews today."
          else
            git config user.name "ompath-bot"
            git config user.email "ompath-bot@users.noreply.github.com"
            git add -f public/topics src/data/topicAi public/image-sitemap.xml src/data/pageSummaries.json src/data/contentChecks.json src/data/contentMarks.json
            git commit -m "Daily AI topic overviews"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Redeploy the site (so the sitemap and topic pages pick up new notes)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" && echo "Redeploy requested."; else echo "No VERCEL_DEPLOY_HOOK secret: skipping redeploy."; fi

name: New Friend Zone games every day
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: zone-daily
  cancel-in-progress: false
jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and independently review today's games through Cloudflare
        run: node scripts/zone/daily.mjs
      - name: Save generated games without rebase conflicts
        run: node scripts/git/commit-generated.mjs "New Friend Zone games (daily)" public/data/zone-daily.json

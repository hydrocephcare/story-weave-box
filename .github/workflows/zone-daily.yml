name: New Friend Zone games every day
# Automatic publishing is paused during the production freeze. Manual dispatch only.
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: zone-daily-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOPIC_MAINTENANCE_URL: ${{ github.ref == 'refs/heads/main' && 'https://www.ompathstudy.com/api/neon-functions?name=topic-maintenance' || vars.TOPIC_MAINTENANCE_STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and independently review today's games through Cloudflare
        run: node scripts/zone/daily.mjs
      - name: Save generated games without rebase conflicts
        run: node scripts/git/commit-generated.mjs "New Friend Zone games (daily)" public/data/zone-daily.json

name: Refresh Cloudflare migration lockfile

on:
  push:
    branches:
      - feat/cloudflare-main-migration
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(cloudflare): refresh lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/cloudflare-main-migration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloudflare): refresh lockfile"
            git push origin feat/cloudflare-main-migration
          fi

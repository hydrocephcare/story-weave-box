name: Repository quality checks

on:
  push:
    branches: [main, staging-preview-fix]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate automation script syntax
        run: |
          node --check scripts/imed/validate-notes.mjs
          node --check scripts/blogs/polish-batch.mjs
          node --check scripts/zone/daily.mjs
          node --check scripts/topics/corpus.mjs
          node --check scripts/topics/bulk-fill.mjs
          node --check scripts/topics/deep-fill.mjs
          node --check scripts/topics/merge-ai.mjs
          node --check scripts/topics/deep-fill-database.mjs
          node --check scripts/topics/review-database-pages.mjs
          node --check scripts/seo/audit-production.mjs
          node --check scripts/library/prerender.mjs
          node --check scripts/git/commit-generated.mjs
          node --check api/_lib/topicWrite.js
          node --check api/_lib/aiChat.js
          node --check api/sitemap.js
          node --check api/_lib/topicMaintenance.js
          node --check api/neon-functions.js
          node --check scripts/topics/maintenance-client.mjs
          node --check scripts/topics/corpus.mjs
          node --check scripts/topics/review-database-pages.mjs
          node --check scripts/topics/deep-fill-database.mjs
          node --check scripts/topics/verify-maintenance.mjs
          node --check api/_lib/entitlements.js
          node --check api/_lib/onekitty.js
          node --check api/neon-functions.js
          node --check api/_lib/blogPolish.js
          node --check api/_lib/blogPolishVerify.js
          node --check api/_lib/blogPolishRun.js
          node --check api/_lib/blogPolishPrompts.js
          node --check supabase/functions/_shared/topicAi.js
          node --check supabase/functions/_shared/contentCheck.js

      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Production build (reuse committed topic corpus; do not reread Supabase)
        env:
          VERCEL: "1"
        run: npm run build

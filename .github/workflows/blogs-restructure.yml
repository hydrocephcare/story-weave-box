name: Tidy the blogs
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many published articles to process"
        required: false
        default: "12"
      year:
        description: "Only this year (1 to 6); leave empty for all"
        required: false
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: blogs-restructure
  cancel-in-progress: false
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Polish and independently verify articles through the Cloudflare backend
        env:
          COUNT: ${{ inputs.count || '12' }}
          YEAR: ${{ inputs.year }}
          MINUTES: "50"
        run: node scripts/blogs/polish-runner.mjs

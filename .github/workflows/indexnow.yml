name: Tell search engines about new pages

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Send every page, not only the ones changed in the last 2 days"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}

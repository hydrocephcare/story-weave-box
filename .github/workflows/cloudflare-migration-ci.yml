name: Cloudflare migration verification

on:
  push:
    branches: [cloudflare-migration-current]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-migration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migration-current
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run existing test suite
        run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Build current production application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://strfwaqvxvkhjbqrwmla.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

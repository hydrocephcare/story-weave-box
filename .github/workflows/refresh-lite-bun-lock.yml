name: Refresh Bun lockfile for Lite

on:
  push:
    branches:
      - feat/ompathstudy-lite-ussd-mvp
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/refresh-lite-bun-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-lite-bun-lock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ompathstudy-lite-ussd-mvp
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Regenerate the text Bun lockfile
        run: bun install --lockfile-only
      - name: Commit the refreshed lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Refresh Bun lockfile for Lite dependencies"
          git push origin feat/ompathstudy-lite-ussd-mvp

name: Supabase keep-alive

on:
  schedule:
    # External database activity four times per day keeps the free project warm.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the public database API
        env:
          # These are public browser credentials, not privileged server secrets.
          SUPABASE_URL: https://strfwaqvxvkhjbqrwmla.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0cmZ3YXF2eHZraGpicXJ3bWxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTIwNzEsImV4cCI6MjEwODI4ODA3MX0.F_bGNSKsC6Wbriit19-OIwNdScqAUU0yhJ3TtQuiTkE
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 10 \
            --connect-timeout 20 --max-time 60 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/articles?select=id&published=eq.true&limit=1" \
            > /dev/null

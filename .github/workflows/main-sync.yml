name: Main sync verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: SEO source guardrails
        run: node scripts/seo/check-regressions.mjs

      - name: Validate production monitor syntax
        run: node --check scripts/seo/audit-production.mjs

      - name: Validate automation script syntax
        run: |
          node --check scripts/imed/validate-notes.mjs
          node --check scripts/blogs/polish-batch.mjs
          node --check scripts/zone/daily.mjs
          node --check scripts/topics/corpus.mjs
          node --check scripts/topics/bulk-fill.mjs
          node --check scripts/topics/deep-fill.mjs
          node --check scripts/topics/merge-ai.mjs
          node --check scripts/topics/deep-fill-database.mjs
          node --check scripts/topics/review-database-pages.mjs
          node --check scripts/seo/audit-production.mjs
          node --check scripts/library/prerender.mjs
          node --check scripts/git/commit-generated.mjs
          find functions -name "*.js" -print0 | xargs -0 -n1 node --check
          node --check api/_lib/topicWrite.js
          node --check api/_lib/aiChat.js
          node --check api/_lib/topicMaintenance.js
          node --check api/_lib/blogPolishAuth.js
          node --check api/_lib/blogPolishQueue.js
          node --check scripts/blogs/polish-runner.mjs
          node --check api/neon-functions.js
          node --check scripts/topics/maintenance-client.mjs
          node --check scripts/topics/corpus.mjs
          node --check scripts/topics/review-database-pages.mjs
          node --check scripts/topics/deep-fill-database.mjs
          node --check scripts/topics/verify-maintenance.mjs
          node --check api/_lib/entitlements.js
          node --check api/_lib/polishConfig.js
          node --check api/_lib/runtimeHealth.js
          node --check api/_lib/sendNotification.js
          node --check api/_lib/neonAdmin.js
          node --check api/_lib/ensureUser.js
          node --check api/drive-notes.js
          node --check api/_lib/drive-notes.js
          node --check api/_lib/generateExam.js
          node --check api/_lib/student-data.js
          node --check api/paystack.js
          node --check api/paystack-webhook.js
          node --check api/_lib/onekitty.js
          node --check api/_lib/topicMaintenance.js
          node --check scripts/topics/bulk-fill.mjs
          node --check api/neon-functions.js
          node --check api/sitemap.js
          node --check api/_lib/blogPolish.js
          node --check api/_lib/blogPolishVerify.js
          node --check api/_lib/blogPolishRun.js
          node --check api/_lib/blogPolishPrompts.js
          node --check supabase/functions/_shared/topicAi.js
          node --check supabase/functions/_shared/contentCheck.js

      - name: Test combined Lovable and repository code
        run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build production site
        run: npm run build
        env:
          VITE_NEON_AUTH_URL: https://ep-dry-haze-benks3ew.neonauth.c-9.us-east-2.aws.neon.tech/neondb/auth
          VITE_NEON_DATA_API_URL: https://ep-dry-haze-benks3ew.apirest.c-9.us-east-2.aws.neon.tech/neondb/rest/v1
          VERCEL: "1"

      - name: Compile Cloudflare Pages Functions
        run: npx wrangler pages functions build ./functions --outdir ./.wrangler/pages-functions --compatibility-date 2026-11-27

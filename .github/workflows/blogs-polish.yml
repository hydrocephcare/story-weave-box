name: Polish and verify published articles
on:
  schedule:
    # Process the published-article backlog throughout the day, not just once.
    # The batch script still applies its per-run time and count limits.
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many published articles to process"
        required: false
        default: "40"
      year:
        description: "Only this year (1 to 6); leave empty for all"
        required: false
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: blogs-polish
  cancel-in-progress: false
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Polish and verify published articles through the Cloudflare backend
        env:
          COUNT: ${{ github.event.inputs.count || '40' }}
          YEAR: ${{ github.event.inputs.year }}
          MINUTES: "50"
        run: node scripts/blogs/polish-runner.mjs

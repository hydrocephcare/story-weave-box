name: Polish and verify published articles
# Automatic article mutation is paused during the production freeze. Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many published articles to process"
        required: false
        default: "40"
      year:
        description: "Only this year (1 to 6); leave empty for all"
        required: false
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: blogs-polish-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Polish and verify published articles through the Cloudflare backend
        env:
          COUNT: ${{ github.event.inputs.count || '40' }}
          YEAR: ${{ github.event.inputs.year }}
          MINUTES: "50"
          BLOG_POLISH_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://www.ompathstudy.com' || vars.BLOG_POLISH_STAGING_BASE_URL }}
        run: node scripts/blogs/polish-runner.mjs

name: Polish and verify published articles
on:
  schedule:
    # Process the published-article backlog throughout the day, not just once.
    # The batch script still applies its per-run time and count limits.
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
  # Run the article pipeline immediately when its safeguards or prompts change.
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogs-polish.yml"
      - "scripts/blogs/polish-batch.mjs"
      - "api/_lib/blogPolish.js"
      - "api/_lib/blogPolishRun.js"
      - "api/_lib/blogPolishVerify.js"
      - "api/_lib/blogPolishPrompts.js"
    inputs:
      count:
        description: "How many published articles to process"
        required: false
        default: "40"
      year:
        description: "Only this year (1 to 6); leave empty for all"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: blogs-polish
  cancel-in-progress: false
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate comprehensive note copy with Groq and independently verify with Gemini
        env:
          POLISH_WRITE_KEY: ${{ secrets.POLISH_WRITE_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          COUNT: ${{ github.event.inputs.count || '40' }}
          YEAR: ${{ github.event.inputs.year }}
        run: |
          if [ -n "$YEAR" ]; then node scripts/blogs/polish-batch.mjs "$COUNT" --year "$YEAR" --minutes 50; else node scripts/blogs/polish-batch.mjs "$COUNT" --minutes 50; fi

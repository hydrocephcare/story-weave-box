# Keeps public Supabase reads in R2 so the free Supabase data limit is not used up by visitors and crawlers.
name = "ompath-sb-cache"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[r2_buckets]]
binding = "CACHE"
bucket_name = "ompath-cache"

